name: Dev prototype tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, beta, main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/spectrum_fft/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q apps/spectrum_fft
      - run: node --check dist/ha-spectrum-card.js
